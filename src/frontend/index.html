<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Streaming</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="module">
        // Import reflect-metadata first (required for class-transformer)
        import 'reflect-metadata';
        
        import './styles/main.css'
        import { DataStreamService } from '@/frontend/DataStreamService';
        import { StreamDataInfo } from '@/models/StreamDataInfo';
        import { StreamAction } from '@/models/StreamMessage';
        import { parseStreamData } from '@/utils/parseStreamData';
        import { extractTemplateVariables } from '@/utils/templateEngine';

        // Initialize after window loads
        window.addEventListener('load', () => {
            const dataService = DataStreamService.getInstance();

            // DOM elements
            const dataInput = document.getElementById('dataInput');
            const lineCountDiv = document.getElementById('lineCount');
            const combineLineInput = document.getElementById('combineLineInput');
            const separatorSelect = document.getElementById('separatorSelect');
            const customSeparatorInput = document.getElementById('customSeparatorInput');
            const domainInput = document.getElementById('domainInput');
            const nameInput = document.getElementById('nameInput');
            const savedDataItems = document.getElementById('savedDataItems');
            const resultDiv = document.getElementById('result');
            const toggleVariablesBtn = document.getElementById('toggleVariables');
            const variablesConfig = document.getElementById('variablesConfig');
            const variablesList = document.getElementById('variablesList');
            const addVariableBtn = document.getElementById('addVariableBtn');

            // Add current selected item variable
            let currentSelectedKey = null;
            
            // Variables state
            let detectedVariables = [];
            let variablesState = [];

            // Debounce function
            function debounce(func, wait) {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => {
                        clearTimeout(timeout);
                        func(...args);
                    };
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);
                };
            }

            // DOM related functions
            function calculateDataSize(data) {
                const bytes = new Blob([data]).size;
                if (bytes < 1024) return `${bytes} B`;
                else if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(2)} KB`;
                else return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
            }

            function updateLineCount() {
                const data = dataInput.value;
                const lines = data.split('\n').filter(line => line.trim() !== '');
                const dataSize = calculateDataSize(data);
                lineCountDiv.textContent = `Total lines: ${lines.length} | Size: ${dataSize}`;
            }

            // Create debounced version of updateLineCount
            const debouncedUpdateLineCount = debounce(updateLineCount, 300);

            // Variables related functions
            function detectAndUpdateVariables() {
                const data = dataInput.value;
                const detected = extractTemplateVariables(data);
                detectedVariables = detected;
                
                // Update button text
                toggleVariablesBtn.textContent = detected.length > 0 
                    ? `${variablesConfig.classList.contains('collapsed') ? '▶' : '▼'} Variables (${detected.length} detected) 💡`
                    : `${variablesConfig.classList.contains('collapsed') ? '▶' : '▼'} Variables`;
                
                // Show/hide variables section
                if (detected.length > 0) {
                    toggleVariablesBtn.style.display = 'block';
                    
                    // Merge with existing state
                    const existingVarNames = variablesState.map(v => v.name);
                    detected.forEach(varName => {
                        if (!existingVarNames.includes(varName)) {
                            variablesState.push({
                                name: varName,
                                source: 'auto',
                                value: ''
                            });
                        }
                    });
                    
                    // Remove variables that are no longer detected
                    variablesState = variablesState.filter(v => 
                        detected.includes(v.name) || v.source === 'fixed'
                    );
                    
                    renderVariablesList();
                } else {
                    toggleVariablesBtn.style.display = 'none';
                }
            }

            function renderVariablesList() {
                variablesList.innerHTML = '';
                
                variablesState.forEach((variable, index) => {
                    const row = document.createElement('div');
                    row.className = 'variable-row';
                    
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'variable-name';
                    nameSpan.textContent = variable.name;
                    
                    const sourceSelect = document.createElement('select');
                    sourceSelect.className = 'variable-source';
                    sourceSelect.innerHTML = `
                        <option value="auto" ${variable.source === 'auto' ? 'selected' : ''}>Auto</option>
                        <option value="fixed" ${variable.source === 'fixed' ? 'selected' : ''}>Fixed</option>
                    `;
                    
                    const valueInput = document.createElement('input');
                    valueInput.type = 'text';
                    valueInput.className = 'variable-value';
                    valueInput.placeholder = variable.source === 'auto' ? 'From request' : 'Enter value';
                    valueInput.value = variable.value || '';
                    valueInput.disabled = variable.source === 'auto';
                    
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'variable-delete-btn';
                    deleteBtn.innerHTML = '❌';
                    deleteBtn.title = 'Delete variable';
                    
                    // Event listeners
                    sourceSelect.addEventListener('change', (e) => {
                        variable.source = e.target.value;
                        valueInput.disabled = variable.source === 'auto';
                        valueInput.placeholder = variable.source === 'auto' ? 'From request' : 'Enter value';
                        if (variable.source === 'auto') {
                            valueInput.value = '';
                            variable.value = '';
                        }
                    });
                    
                    valueInput.addEventListener('input', (e) => {
                        variable.value = e.target.value;
                    });
                    
                    deleteBtn.addEventListener('click', () => {
                        variablesState.splice(index, 1);
                        renderVariablesList();
                    });
                    
                    row.appendChild(nameSpan);
                    row.appendChild(sourceSelect);
                    row.appendChild(valueInput);
                    row.appendChild(deleteBtn);
                    
                    variablesList.appendChild(row);
                });
            }

            function toggleVariablesSection() {
                variablesConfig.classList.toggle('collapsed');
                const isCollapsed = variablesConfig.classList.contains('collapsed');
                toggleVariablesBtn.textContent = detectedVariables.length > 0 
                    ? `${isCollapsed ? '▶' : '▼'} Variables (${detectedVariables.length} detected) 💡`
                    : `${isCollapsed ? '▶' : '▼'} Variables`;
            }

            // Debounced version of variable detection
            const debouncedDetectVariables = debounce(detectAndUpdateVariables, 300);

            // Generate random values for auto variables and include fixed values
            function generateRandomVariableValues() {
                const values = {};
                
                if (variablesState.length === 0) {
                    return values;
                }
                
                variablesState.forEach(variable => {
                    if (variable.source === 'auto') {
                        // Generate random value based on variable name
                        if (variable.name.toLowerCase().includes('id') || variable.name.toLowerCase().includes('session')) {
                            // UUID-like format for IDs
                            values[variable.name] = generateUUID();
                        } else if (variable.name.toLowerCase().includes('query') || variable.name.toLowerCase().includes('text')) {
                            // Sample queries
                            const sampleQueries = ['buy me a tv', 'find a restaurant', 'book a flight', 'search for hotels'];
                            values[variable.name] = sampleQueries[Math.floor(Math.random() * sampleQueries.length)];
                        } else if (variable.name.toLowerCase().includes('user')) {
                            values[variable.name] = `user_${Math.floor(Math.random() * 10000)}`;
                        } else {
                            // Generic random value
                            values[variable.name] = `value_${Math.floor(Math.random() * 10000)}`;
                        }
                    } else if (variable.source === 'fixed' && variable.value) {
                        // Use fixed value
                        values[variable.name] = variable.value;
                    }
                });
                
                return values;
            }
            
            // Generate UUID v4
            function generateUUID() {
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                    const r = Math.random() * 16 | 0;
                    const v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
            }

            function handleSeparatorChange() {
                if (separatorSelect.value === 'custom') {
                    customSeparatorInput.style.display = 'inline';
                } else {
                    customSeparatorInput.style.display = 'none';
                }
            }

            // Copy button functionality
            document.getElementById('copyDataBtn').addEventListener('click', () => {
                dataInput.select();
                document.execCommand('copy');
                const btn = document.getElementById('copyDataBtn');
                btn.innerHTML = '<i class="fas fa-check"></i>';
                setTimeout(() => {
                    btn.innerHTML = '<i class="fas fa-copy"></i>';
                }, 2000);
            });

            // Open new window functionality
            document.getElementById('openNewWindow').addEventListener('click', () => {
                const width = 800;
                const height = 600;
                const left = (window.screen.width - width) / 2;
                const top = (window.screen.height - height) / 2;
                
                // Generate random variable values if there are auto variables
                const varValues = generateRandomVariableValues();
                
                // Build URL with query parameters
                let url = window.location.origin + "/api/stream";
                if (Object.keys(varValues).length > 0) {
                    const params = new URLSearchParams(varValues);
                    url += '?' + params.toString();
                    
                    // Log the generated values for user reference
                    console.log('🎲 Generated variable values:', varValues);
                }
                
                window.open(url, '_blank',
                    `width=${width},height=${height},left=${left},top=${top}`);
            });

            // Business logic handling
            async function handleSubmit() {
                try {
                    const streamData = new StreamDataInfo(
                        dataInput.value,
                        combineLineInput.value,
                        separatorSelect.value === 'custom' ? customSeparatorInput.value : separatorSelect.value,
                        domainInput.value,
                        nameInput.value,
                        undefined,  // timestamp
                        undefined,  // encodedKey
                        variablesState  // variables
                    );

                    const result = await dataService.submitData(streamData);
                    alert(result);
                } catch (error) {
                    console.error('Error submitting data:', error);
                    alert('Error submitting data. Check console for details.');
                }
            }

            async function loadSavedDataList() {
                try {
                    const savedData = await dataService.loadSavedDataList();
                    displaySavedDataList(savedData);
                } catch (error) {
                    console.error('Error loading saved data list:', error);
                    savedDataItems.innerHTML = '<p>Error loading saved data list</p>';
                }
            }

            async function loadSavedData(encodedKey) {
                try {
                    const result = await dataService.loadSavedData(encodedKey);
                    dataInput.value = result.data;
                    combineLineInput.value = result.combineLine;
                    separatorSelect.value = result.separator;
                    domainInput.value = result.domain;
                    nameInput.value = result.name;
                    variablesState = result.variables || [];
                    currentSelectedKey = encodedKey;
                    updateLineCount();
                    detectAndUpdateVariables();
                    displaySavedDataList(await dataService.loadSavedDataList()); // Refresh list to update highlight
                } catch (error) {
                    console.error('Error loading saved data:', error);
                    alert('Error loading saved data. Check console for details.');
                }
            }

            async function deleteSavedData(encodedKey) {
                try {
                    await dataService.deleteSavedData(encodedKey);
                    if (currentSelectedKey === encodedKey) {
                        currentSelectedKey = null;
                    }
                    displaySavedDataList(await dataService.loadSavedDataList()); // Refresh list
                } catch (error) {
                    console.error('Error deleting saved data:', error);
                    alert('Error deleting saved data. Check console for details.');
                }
            }

            function displaySavedDataList(dataList) {
                savedDataItems.innerHTML = '';
                dataList.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'saved-data-item';
                    if (item.encodedKey === currentSelectedKey) {
                        div.classList.add('selected');
                    }

                    const span = document.createElement('span');
                    span.textContent = item.displayName;

                    const buttonsDiv = document.createElement('div');

                    const loadButton = document.createElement('button');
                    loadButton.textContent = 'Load';
                    loadButton.addEventListener('click', () => loadSavedData(item.encodedKey));

                    const deleteButton = document.createElement('button');
                    deleteButton.textContent = 'Delete';
                    deleteButton.className = 'delete-btn';
                    deleteButton.addEventListener('click', () => deleteSavedData(item.encodedKey));

                    buttonsDiv.appendChild(loadButton);
                    buttonsDiv.appendChild(deleteButton);

                    div.appendChild(span);
                    div.appendChild(buttonsDiv);
                    savedDataItems.appendChild(div);
                });
            }

            // Event listeners setup
            dataInput.addEventListener('input', () => {
                debouncedUpdateLineCount();
                debouncedDetectVariables();
            });
            separatorSelect.addEventListener('change', handleSeparatorChange);
            toggleVariablesBtn.addEventListener('click', toggleVariablesSection);

            document.getElementById('submitData').addEventListener('click', handleSubmit);
            document.getElementById('startStream').addEventListener('click', () => {
                resultDiv.innerHTML = '';
                
                // Generate random variable values if there are auto variables
                const varValues = generateRandomVariableValues();
                
                // Show generated values to user
                if (Object.keys(varValues).length > 0) {
                    const infoP = document.createElement('p');
                    infoP.style.backgroundColor = '#e8f1fa';
                    infoP.style.color = '#2196F3';
                    infoP.style.fontWeight = 'bold';
                    infoP.textContent = `🎲 Generated variables: ${JSON.stringify(varValues, null, 2)}`;
                    resultDiv.appendChild(infoP);
                    
                    console.log('🎲 Generated variable values:', varValues);
                }
                
                dataService.startStream(data => {
                    const p = document.createElement('p');
                    p.textContent = data;
                    resultDiv.appendChild(p);
                }, varValues);
            });
            document.getElementById('refreshList').addEventListener('click', loadSavedDataList);

            // Initial loading
            async function initialLoad() {
                try {
                    const result = await dataService.loadSavedData(); // Call without key for initial load
                    if (result) {
                        dataInput.value = result.data;
                        combineLineInput.value = result.combineLine;
                        separatorSelect.value = result.separator;
                        domainInput.value = result.domain;
                        nameInput.value = result.name;
                        variablesState = result.variables || [];
                        currentSelectedKey = result.encodedKey;
                        updateLineCount();
                        detectAndUpdateVariables();
                    }
                } catch (error) {
                    console.error('Error in initial load:', error);
                }
                await loadSavedDataList();
            }

            initialLoad();

            // Add WebSocket update listener
            dataService.addUpdateListener(async (action, key) => {
                console.log('Received update notification:', action, key);
                if (action === StreamAction.SUBMIT && key) {
                    // If it's a submit operation, load new data first
                    await loadSavedData(key);
                }
                // Refresh list
                await loadSavedDataList();
            });

            document.getElementById('showResultBtn').addEventListener('click', async () => {
                // 直接取 textarea 的内容
                const streamRaw = dataInput.value;
                // 解析
                const parsed = parseStreamData(streamRaw);
                // 通过 window.name 传递数据到 result.html
                const width = 800;
                const height = 600;
                const left = (window.screen.width - width) / 2;
                const top = (window.screen.height - height) / 2;
                const win = window.open('/result.html', '_blank', `width=${width},height=${height},left=${left},top=${top}`);
                win.name = JSON.stringify(parsed);
            });
        });
    </script>
</head>

<body>
    <div class="container">
        <h1>Data Streaming</h1>

        <div class="main-content">
            <!-- Left Panel -->
            <div class="left-panel">
                <!-- Input Section -->
                <div class="card input-section">
                    <div class="textarea-container">
                        <textarea id="dataInput" placeholder="Enter data (one item per line)"></textarea>
                        <button id="copyDataBtn" class="icon-button" title="Copy to clipboard">
                            <i class="fas fa-copy"></i>
                        </button>
                    </div>
                    <div id="lineCount">Total lines: 0</div>

                    <input type="text" id="combineLineInput" placeholder="Combine Line (e.g. 101-104)"
                        style="display: none;">

                    <div class="select-group" style="display: none;">
                        <select id="separatorSelect">
                            <option value="">No separator</option>
                            <option value="\n">New line (\n)</option>
                            <option value="\r">Carriage return (\r)</option>
                            <option value="\t">Tab (\t)</option>
                            <option value="\v">Vertical tab (\v)</option>
                            <option value="\f">Form feed (\f)</option>
                            <option value="\u2028">Line separator (\u2028)</option>
                            <option value="\u2029">Paragraph separator (\u2029)</option>
                            <option value="\u200B">Zero width space (\u200B)</option>
                            <option value="\uFEFF">Zero width no-break space (\uFEFF)</option>
                            <option value="\u200D">Zero width joiner (\u200D)</option>
                            <option value="\u00AD">Soft hyphen (\u00AD)</option>
                            <option value="custom">Custom...</option>
                        </select>
                        <input type="text" id="customSeparatorInput" placeholder="Enter custom separator"
                            style="display: none;">
                    </div>

                    <input type="text" id="domainInput" placeholder="Enter domain">
                    <input type="text" id="nameInput" placeholder="Enter name">

                    <!-- Variables Configuration Section -->
                    <div class="variables-section">
                        <button type="button" id="toggleVariables" class="variables-toggle" style="display: none;">
                            ▶ Variables
                        </button>
                        <div id="variablesConfig" class="variables-config collapsed">
                            <div id="variablesList" class="variables-list"></div>
                        </div>
                    </div>

                    <div class="button-group">
                        <button id="submitData">Submit Data</button>
                        <button id="startStream">Start Streaming</button>
                        <button id="openNewWindow">
                            <i class="fas fa-external-link-alt"></i>
                            Open Streaming in New Window
                        </button>
                        <button id="showResultBtn">Show me the result</button>
                    </div>
                </div>

                <!-- Saved Data List Section -->
                <div class="card saved-data-list">
                    <div class="list-header">
                        <h2>Saved Data</h2>
                        <button id="refreshList">Refresh List</button>
                    </div>
                    <div id="savedDataItems"></div>
                </div>
            </div>

            <!-- Right Panel -->
            <div class="right-panel">
                <div class="card" id="result"></div>
            </div>
        </div>
    </div>
</body>

</html>
