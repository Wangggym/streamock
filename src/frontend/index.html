<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Streaming</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="module">
        import './styles/main.css'
        import { DataStreamService } from '@/frontend/DataStreamService';
        import { StreamDataInfo } from '@/models/StreamDataInfo';
        import { StreamAction } from '@/models/StreamMessage';
        import { parseStreamData } from '@/utils/parseStreamData';

        // Initialize after window loads
        window.addEventListener('load', () => {
            const dataService = DataStreamService.getInstance();

            // DOM elements
            const dataInput = document.getElementById('dataInput');
            const lineCountDiv = document.getElementById('lineCount');
            const combineLineInput = document.getElementById('combineLineInput');
            const separatorSelect = document.getElementById('separatorSelect');
            const customSeparatorInput = document.getElementById('customSeparatorInput');
            const domainInput = document.getElementById('domainInput');
            const nameInput = document.getElementById('nameInput');
            const savedDataItems = document.getElementById('savedDataItems');
            const resultDiv = document.getElementById('result');

            // Add current selected item variable
            let currentSelectedKey = null;

            // Debounce function
            function debounce(func, wait) {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => {
                        clearTimeout(timeout);
                        func(...args);
                    };
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);
                };
            }

            // DOM related functions
            function calculateDataSize(data) {
                const bytes = new Blob([data]).size;
                if (bytes < 1024) return `${bytes} B`;
                else if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(2)} KB`;
                else return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
            }

            function updateLineCount() {
                const data = dataInput.value;
                const lines = data.split('\n').filter(line => line.trim() !== '');
                const dataSize = calculateDataSize(data);
                lineCountDiv.textContent = `Total lines: ${lines.length} | Size: ${dataSize}`;
            }

            // Create debounced version of updateLineCount
            const debouncedUpdateLineCount = debounce(updateLineCount, 300);

            function handleSeparatorChange() {
                if (separatorSelect.value === 'custom') {
                    customSeparatorInput.style.display = 'inline';
                } else {
                    customSeparatorInput.style.display = 'none';
                }
            }

            // Copy button functionality
            document.getElementById('copyDataBtn').addEventListener('click', () => {
                dataInput.select();
                document.execCommand('copy');
                const btn = document.getElementById('copyDataBtn');
                btn.innerHTML = '<i class="fas fa-check"></i>';
                setTimeout(() => {
                    btn.innerHTML = '<i class="fas fa-copy"></i>';
                }, 2000);
            });

            // Open new window functionality
            document.getElementById('openNewWindow').addEventListener('click', () => {
                const width = 800;
                const height = 600;
                const left = (window.screen.width - width) / 2;
                const top = (window.screen.height - height) / 2;
                window.open(window.location.origin + "/api/stream", '_blank',
                    `width=${width},height=${height},left=${left},top=${top}`);
            });

            // Business logic handling
            async function handleSubmit() {
                try {
                    const streamData = new StreamDataInfo(
                        dataInput.value,
                        combineLineInput.value,
                        separatorSelect.value === 'custom' ? customSeparatorInput.value : separatorSelect.value,
                        domainInput.value,
                        nameInput.value
                    );

                    const result = await dataService.submitData(streamData);
                    alert(result);
                } catch (error) {
                    console.error('Error submitting data:', error);
                    alert('Error submitting data. Check console for details.');
                }
            }

            async function loadSavedDataList() {
                try {
                    const savedData = await dataService.loadSavedDataList();
                    displaySavedDataList(savedData);
                } catch (error) {
                    console.error('Error loading saved data list:', error);
                    savedDataItems.innerHTML = '<p>Error loading saved data list</p>';
                }
            }

            async function loadSavedData(encodedKey) {
                try {
                    const result = await dataService.loadSavedData(encodedKey);
                    dataInput.value = result.data;
                    combineLineInput.value = result.combineLine;
                    separatorSelect.value = result.separator;
                    domainInput.value = result.domain;
                    nameInput.value = result.name;
                    currentSelectedKey = encodedKey;
                    updateLineCount();
                    displaySavedDataList(await dataService.loadSavedDataList()); // Refresh list to update highlight
                } catch (error) {
                    console.error('Error loading saved data:', error);
                    alert('Error loading saved data. Check console for details.');
                }
            }

            async function deleteSavedData(encodedKey) {
                try {
                    await dataService.deleteSavedData(encodedKey);
                    if (currentSelectedKey === encodedKey) {
                        currentSelectedKey = null;
                    }
                    displaySavedDataList(await dataService.loadSavedDataList()); // Refresh list
                } catch (error) {
                    console.error('Error deleting saved data:', error);
                    alert('Error deleting saved data. Check console for details.');
                }
            }

            function displaySavedDataList(dataList) {
                savedDataItems.innerHTML = '';
                dataList.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'saved-data-item';
                    if (item.encodedKey === currentSelectedKey) {
                        div.classList.add('selected');
                    }

                    const span = document.createElement('span');
                    span.textContent = item.displayName;

                    const buttonsDiv = document.createElement('div');

                    const loadButton = document.createElement('button');
                    loadButton.textContent = 'Load';
                    loadButton.addEventListener('click', () => loadSavedData(item.encodedKey));

                    const deleteButton = document.createElement('button');
                    deleteButton.textContent = 'Delete';
                    deleteButton.className = 'delete-btn';
                    deleteButton.addEventListener('click', () => deleteSavedData(item.encodedKey));

                    buttonsDiv.appendChild(loadButton);
                    buttonsDiv.appendChild(deleteButton);

                    div.appendChild(span);
                    div.appendChild(buttonsDiv);
                    savedDataItems.appendChild(div);
                });
            }

            // Event listeners setup
            dataInput.addEventListener('input', debouncedUpdateLineCount);
            separatorSelect.addEventListener('change', handleSeparatorChange);

            document.getElementById('submitData').addEventListener('click', handleSubmit);
            document.getElementById('startStream').addEventListener('click', () => {
                resultDiv.innerHTML = '';
                dataService.startStream(data => {
                    const p = document.createElement('p');
                    p.textContent = data;
                    resultDiv.appendChild(p);
                });
            });
            document.getElementById('refreshList').addEventListener('click', loadSavedDataList);

            // Initial loading
            async function initialLoad() {
                try {
                    const result = await dataService.loadSavedData(); // Call without key for initial load
                    if (result) {
                        dataInput.value = result.data;
                        combineLineInput.value = result.combineLine;
                        separatorSelect.value = result.separator;
                        domainInput.value = result.domain;
                        nameInput.value = result.name;
                        currentSelectedKey = result.encodedKey;
                        updateLineCount();
                    }
                } catch (error) {
                    console.error('Error in initial load:', error);
                }
                await loadSavedDataList();
            }

            initialLoad();

            // Add WebSocket update listener
            dataService.addUpdateListener(async (action, key) => {
                console.log('Received update notification:', action, key);
                if (action === StreamAction.SUBMIT && key) {
                    // If it's a submit operation, load new data first
                    await loadSavedData(key);
                }
                // Refresh list
                await loadSavedDataList();
            });

            document.getElementById('showResultBtn').addEventListener('click', async () => {
                // 直接取 textarea 的内容
                const streamRaw = dataInput.value;
                // 解析
                const parsed = parseStreamData(streamRaw);
                // 通过 window.name 传递数据到 result.html
                const width = 800;
                const height = 600;
                const left = (window.screen.width - width) / 2;
                const top = (window.screen.height - height) / 2;
                const win = window.open('result.html', '_blank', `width=${width},height=${height},left=${left},top=${top}`);
                win.name = JSON.stringify(parsed);
            });
        });
    </script>
</head>

<body>
    <div class="container">
        <h1>Data Streaming</h1>

        <div class="main-content">
            <!-- Left Panel -->
            <div class="left-panel">
                <!-- Input Section -->
                <div class="card input-section">
                    <div class="textarea-container">
                        <textarea id="dataInput" placeholder="Enter data (one item per line)"></textarea>
                        <button id="copyDataBtn" class="icon-button" title="Copy to clipboard">
                            <i class="fas fa-copy"></i>
                        </button>
                    </div>
                    <div id="lineCount">Total lines: 0</div>

                    <input type="text" id="combineLineInput" placeholder="Combine Line (e.g. 101-104)"
                        style="display: none;">

                    <div class="select-group" style="display: none;">
                        <select id="separatorSelect">
                            <option value="">No separator</option>
                            <option value="\n">New line (\n)</option>
                            <option value="\r">Carriage return (\r)</option>
                            <option value="\t">Tab (\t)</option>
                            <option value="\v">Vertical tab (\v)</option>
                            <option value="\f">Form feed (\f)</option>
                            <option value="\u2028">Line separator (\u2028)</option>
                            <option value="\u2029">Paragraph separator (\u2029)</option>
                            <option value="\u200B">Zero width space (\u200B)</option>
                            <option value="\uFEFF">Zero width no-break space (\uFEFF)</option>
                            <option value="\u200D">Zero width joiner (\u200D)</option>
                            <option value="\u00AD">Soft hyphen (\u00AD)</option>
                            <option value="custom">Custom...</option>
                        </select>
                        <input type="text" id="customSeparatorInput" placeholder="Enter custom separator"
                            style="display: none;">
                    </div>

                    <input type="text" id="domainInput" placeholder="Enter domain">
                    <input type="text" id="nameInput" placeholder="Enter name">

                    <div class="button-group">
                        <button id="submitData">Submit Data</button>
                        <button id="startStream">Start Streaming</button>
                        <button id="openNewWindow">
                            <i class="fas fa-external-link-alt"></i>
                            Open Streaming in New Window
                        </button>
                        <button id="showResultBtn">Show me the result</button>
                    </div>
                </div>

                <!-- Saved Data List Section -->
                <div class="card saved-data-list">
                    <div class="list-header">
                        <h2>Saved Data</h2>
                        <button id="refreshList">Refresh List</button>
                    </div>
                    <div id="savedDataItems"></div>
                </div>
            </div>

            <!-- Right Panel -->
            <div class="right-panel">
                <div class="card" id="result"></div>
            </div>
        </div>
    </div>
</body>

</html>
