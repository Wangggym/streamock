<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Streaming</title>
    <script src="https://unpkg.com/class-transformer@0.5.1/browser/class-transformer.js"></script>
    <style>
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .saved-data-list {
            margin: 20px 0;
            border: 1px solid #ccc;
            padding: 10px;
        }
        .saved-data-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px;
            border-bottom: 1px solid #eee;
        }
        .saved-data-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Data Streaming</h1>
        
        <!-- Input Section -->
        <div class="input-section">
            <textarea id="dataInput" rows="4" cols="50" placeholder="Enter data (one item per line)"></textarea><br>
            <div id="lineCount">Total lines: 0</div>
            <input type="text" id="combineLineInput" placeholder="Combine Line (e.g. 101-104)"><br>
            <select id="separatorSelect">
                <option value="">No separator</option>
                <option value="\n">New line (\n)</option>
                <option value="\r">Carriage return (\r)</option>
                <option value="\t">Tab (\t)</option>
                <option value="\v">Vertical tab (\v)</option>
                <option value="\f">Form feed (\f)</option>
                <option value="\u2028">Line separator (\u2028)</option>
                <option value="\u2029">Paragraph separator (\u2029)</option>
                <option value="\u200B">Zero width space (\u200B)</option>
                <option value="\uFEFF">Zero width no-break space (\uFEFF)</option>
                <option value="\u200D">Zero width joiner (\u200D)</option>
                <option value="\u00AD">Soft hyphen (\u00AD)</option>
                <option value="custom">Custom...</option>
            </select>
            <input type="text" id="customSeparatorInput" placeholder="Enter custom separator" style="display: none;"><br>
            
            <!-- Domain and Name inputs -->
            <input type="text" id="domainInput" placeholder="Enter domain"><br>
            <input type="text" id="nameInput" placeholder="Enter name"><br>
            
            <button id="submitData">Submit Data</button>
            <button id="startStream">Start Streaming</button>
        </div>

        <!-- Saved Data List Section -->
        <div class="saved-data-list">
            <h2>Saved Data</h2>
            <button id="refreshList">Refresh List</button>
            <div id="savedDataItems"></div>
        </div>

        <div id="result"></div>
    </div>

    <script>
        // Define StreamDataInfo class in frontend
        class StreamDataInfo {
            uuid = '';
            data = '';
            combineLine = '';
            separator = '';
            domain = '';
            name = '';

            constructor(data = '', combineLine = '', separator = '', domain = '', name = '') {
                this.uuid = crypto.randomUUID();
                this.data = data;
                this.combineLine = combineLine;
                this.separator = separator;
                this.domain = domain;
                this.name = name;
            }

            get displayName() {
                return `${this.domain}_${this.name || this.uuid}`;
            }

            get key() {
                const params = new URLSearchParams();
                params.append('uuid', this.uuid);
                params.append('domain', this.domain);
                params.append('name', this.name);
                params.append('data', this.data);
                params.append('combineLine', this.combineLine);
                params.append('separator', this.separator);
                return params.toString();
            }

            get encodedKey() {
                return btoa(this.key);
            }

            static fromEncodedKey(encodedKey, data = '') {
                try {
                    const decodedKey = atob(encodedKey);
                    const params = new URLSearchParams(decodedKey);
                    const streamData = new StreamDataInfo(
                        data,
                        params.get('combineLine') || '',
                        params.get('separator') || '',
                        params.get('domain') || '',
                        params.get('name') || ''
                    );
                    streamData.uuid = params.get('uuid') || streamData.uuid;
                    return streamData;
                } catch (error) {
                    console.error(`Error parsing encoded key: ${encodedKey}`, error);
                    throw error;
                }
            }
        }

        const dataInput = document.getElementById('dataInput');
        const lineCountDiv = document.getElementById('lineCount');
        const combineLineInput = document.getElementById('combineLineInput');
        const separatorSelect = document.getElementById('separatorSelect');
        const customSeparatorInput = document.getElementById('customSeparatorInput');
        const domainInput = document.getElementById('domainInput');
        const nameInput = document.getElementById('nameInput');
        const savedDataItems = document.getElementById('savedDataItems');

        // Load saved data from localStorage
        window.addEventListener('load', () => {
            const savedData = localStorage.getItem('userData');
            const savedCombineLine = localStorage.getItem('userCombineLine');
            const savedSeparator = localStorage.getItem('userSeparator');
            const savedDomain = localStorage.getItem('userDomain');
            const savedName = localStorage.getItem('userName');
            
            if (savedData) {
                dataInput.value = savedData;
                updateLineCount();
            }
            
            if (savedCombineLine) {
                combineLineInput.value = savedCombineLine;
            }

            if (savedSeparator) {
                if (Array.from(separatorSelect.options).some(option => option.value === savedSeparator)) {
                    separatorSelect.value = savedSeparator;
                } else {
                    separatorSelect.value = 'custom';
                    customSeparatorInput.value = savedSeparator;
                    customSeparatorInput.style.display = 'inline';
                }
            }

            if (savedDomain) {
                domainInput.value = savedDomain;
            }

            if (savedName) {
                nameInput.value = savedName;
            }

            // Load the list of saved data
            loadSavedDataList();
        });

        function updateLineCount() {
            const data = dataInput.value;
            const lines = data.split('\n').filter(line => line.trim() !== '');
            const lineCount = lines.length;
            lineCountDiv.textContent = `Total lines: ${lineCount}`;
            
            // Save data to localStorage
            localStorage.setItem('userData', data);
        }

        function saveCombineLine() {
            localStorage.setItem('userCombineLine', combineLineInput.value);
        }

        function saveSeparator() {
            const separator = separatorSelect.value === 'custom' ? customSeparatorInput.value : separatorSelect.value;
            localStorage.setItem('userSeparator', separator);
        }

        function saveDomainAndName() {
            localStorage.setItem('userDomain', domainInput.value);
            localStorage.setItem('userName', nameInput.value);
        }

        dataInput.addEventListener('input', updateLineCount);
        combineLineInput.addEventListener('input', saveCombineLine);
        separatorSelect.addEventListener('change', () => {
            if (separatorSelect.value === 'custom') {
                customSeparatorInput.style.display = 'inline';
            } else {
                customSeparatorInput.style.display = 'none';
            }
            saveSeparator();
        });
        customSeparatorInput.addEventListener('input', saveSeparator);
        domainInput.addEventListener('input', saveDomainAndName);
        nameInput.addEventListener('input', saveDomainAndName);

        document.getElementById('submitData').addEventListener('click', async () => {
            try {
                const streamData = new StreamDataInfo(
                    dataInput.value,
                    combineLineInput.value,
                    separatorSelect.value === 'custom' ? customSeparatorInput.value : separatorSelect.value,
                    domainInput.value,
                    nameInput.value
                );

                const response = await fetch('/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(streamData)
                });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const result = await response.text();
                alert(result);
                loadSavedDataList();
            } catch (error) {
                console.error('Error submitting data:', error);
                alert('Error submitting data. Check console for details.');
            }
        });

        async function loadSavedDataList() {
            try {
                const response = await fetch('/list');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const savedDataJson = await response.json();
                // Transform plain objects to StreamDataInfo instances
                const savedData = savedDataJson.map(item => {
                    const streamData = new StreamDataInfo(
                        item.data,
                        item.combineLine,
                        item.separator,
                        item.domain,
                        item.name
                    );
                    streamData.uuid = item.uuid;
                    return streamData;
                });
                displaySavedDataList(savedData);
            } catch (error) {
                console.error('Error loading saved data list:', error);
                savedDataItems.innerHTML = '<p>Error loading saved data list</p>';
            }
        }

        function displaySavedDataList(dataList) {
            savedDataItems.innerHTML = '';
            dataList.forEach(item => {
                const div = document.createElement('div');
                div.className = 'saved-data-item';
                div.innerHTML = `
                    <span>${item.displayName}</span>
                    <div>
                        <button onclick="loadSavedData('${item.encodedKey}')">Load</button>
                        <button onclick="deleteSavedData('${item.encodedKey}')" class="delete-btn">Delete</button>
                    </div>
                `;
                savedDataItems.appendChild(div);
            });
        }

        async function loadSavedData(key) {
            try {
                const response = await fetch(`/load?key=${encodeURIComponent(key)}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const result = await response.json();
                const streamData = new StreamDataInfo(
                    result.data.data,
                    result.data.combineLine,
                    result.data.separator,
                    result.data.domain,
                    result.data.name
                );
                streamData.uuid = result.data.uuid;
                
                // Update the form with loaded data
                dataInput.value = streamData.data;
                combineLineInput.value = streamData.combineLine;
                if (Array.from(separatorSelect.options).some(option => option.value === streamData.separator)) {
                    separatorSelect.value = streamData.separator;
                    customSeparatorInput.style.display = 'none';
                } else {
                    separatorSelect.value = 'custom';
                    customSeparatorInput.value = streamData.separator;
                    customSeparatorInput.style.display = 'inline';
                }
                domainInput.value = streamData.domain;
                nameInput.value = streamData.name;

                // Update localStorage
                updateLineCount();
                saveCombineLine();
                saveSeparator();
                saveDomainAndName();

                alert('Data loaded successfully');
            } catch (error) {
                console.error('Error loading saved data:', error);
                alert('Error loading saved data. Check console for details.');
            }
        }

        document.getElementById('refreshList').addEventListener('click', loadSavedDataList);

        document.getElementById('startStream').addEventListener('click', () => {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = ''; // Clear previous results

            console.log('Starting stream...');

            fetch('/stream').then(response => {
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                function processText(text) {
                    const lines = (buffer + text).split('\n');
                    buffer = lines.pop(); // Keep the last incomplete chunk in the buffer

                    lines.forEach(line => {
                        if (line.trim() !== '') {
                            console.log('Received data:', line);
                            const p = document.createElement('p');
                            p.textContent = line;
                            resultDiv.appendChild(p);

                            if (line.trim() === '[DONE]') {
                                console.log('Received [DONE], closing stream');
                                reader.cancel();
                            }
                        }
                    });
                }

                function pump() {
                    return reader.read().then(({ done, value }) => {
                        if (done) {
                            if (buffer) processText(buffer);
                            return;
                        }
                        processText(decoder.decode(value, { stream: true }));
                        return pump();
                    });
                }

                return pump();
            }).catch(error => {
                console.error('Fetch error:', error);
            });
        });
    </script>
</body>
</html>
